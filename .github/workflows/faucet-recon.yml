name: faucet-recon

on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install solders
        run: pip install solders
      - name: Run faucet recon
        env:
          GH_USER_TOKEN: ${{ secrets.GH_USER_TOKEN }}
        run: python demo/faucet_recon.py
