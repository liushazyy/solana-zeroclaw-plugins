name: callback-airdrop

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install solders playwright
          python -m playwright install chromium --with-deps
      - name: Callback + airdrop + pay
        env:
          CALLBACK_ARGS: ${{ secrets.CALLBACK_ARGS }}
        run: python demo/callback_airdrop.py
