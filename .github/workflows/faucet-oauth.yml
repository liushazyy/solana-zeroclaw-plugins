name: faucet-oauth

on:
  workflow_dispatch:

jobs:
  oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install solders playwright
          python -m playwright install chromium --with-deps
      - name: Run OAuth faucet
        env:
          GH_EMAIL: ${{ secrets.GH_EMAIL }}
          GH_PASS: ${{ secrets.GH_PASS }}
          GH_OTP: ${{ secrets.GH_OTP }}
        run: python demo/oauth_faucet.py
