name: local-validator-demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install solders
          curl -sL -o /tmp/sol.tar.bz2 "https://github.com/solana-labs/solana/releases/download/v2.1.0/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/sol.tar.bz2 -C /tmp
          sudo ln -sf /tmp/solana-release/bin/solana-test-validator /usr/local/bin/
          sudo ln -sf /tmp/solana-release/bin/solana /usr/local/bin/
          solana-test-validator --version
      - name: Run local chain demo
        run: python demo/local_validator_demo.py
